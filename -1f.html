<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旧图书馆 -1F | 按铃解谜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "SimSun", 宋体;
        }
        body {
            background-color: #050505;
            color: #f0e6d2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        .scene-title {
            font-size: 28px;
            margin-bottom: 40px;
            color: #d4a373;
        }
        .bell-group {
            display: flex;
            gap: 80px;
            justify-content: center;
            margin: 50px 0;
        }
        .bell-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background-color: #3a1a1a;
            border: 3px solid #d4a373;
            color: #f0e6d2;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .bell-btn:hover {
            background-color: #5c2b2b;
            box-shadow: 0 0 20px rgba(212, 163, 115, 0.5);
            transform: scale(1.05);
        }
        .bell-btn:active {
            transform: scale(0.95);
        }
        .bell-icon {
            font-size: 48px;
        }
        .sequence-box {
            background-color: rgba(8, 4, 4, 0.8);
            border: 1px solid #5c2b2b;
            padding: 20px 40px;
            margin: 20px auto;
            width: 400px;
        }
        .sequence-label {
            color: #886444;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .sequence-content {
            color: #f0e6d2;
            font-size: 24px;
            letter-spacing: 4px;
        }
        .next-btn {
            padding: 12px 40px;
            background-color: #3a1a1a;
            color: #f0e6d2;
            border: 2px solid #d4a373;
            font-size: 20px;
            cursor: pointer;
            margin-top: 30px;
            display: none;
        }
        .next-btn.show {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="scene-title">旧图书馆 -1F · 按铃解谜</h1>
        <div class="sequence-box">
            <div class="sequence-label">当前序列</div>
            <div class="sequence-content" id="currentSequence">[]</div>
        </div>
        <div class="bell-group">
            <button class="bell-btn" id="shortBell">
                <span class="bell-icon">🔔</span>
                <span>短音</span>
            </button>
            <button class="bell-btn" id="longBell">
                <span class="bell-icon">🔔</span>
                <span>长音</span>
            </button>
        </div>
        <button class="next-btn" id="nextBtn">进入第二道门</button>
    </div>

    <script>
        // 目标序列：三短一长
        const target = ['短', '短', '短', '长'];
        // 当前输入的序列
        let current = [];
        
        const shortBtn = document.getElementById('shortBell');
        const longBtn = document.getElementById('longBell');
        const sequenceText = document.getElementById('currentSequence');
        const nextBtn = document.getElementById('nextBtn');

        // 短音按钮点击事件
        shortBtn.addEventListener('click', () => {
            addToSequence('短');
        });

        // 长音按钮点击事件
        longBtn.addEventListener('click', () => {
            addToSequence('长');
        });

        // 添加序列并判断是否正确
        function addToSequence(type) {
            current.push(type);
            sequenceText.textContent = `[${current.join('、')}]`;
            
            // 序列长度达到4时，判断是否匹配目标
            if (current.length === 4) {
                if (JSON.stringify(current) === JSON.stringify(target)) {
                    nextBtn.classList.add('show'); // 显示“进入下一关”按钮
                } else {
                    // 序列错误，清空重输
                    alert('序列错误，请重新按铃！');
                    current = [];
                    sequenceText.textContent = '[]';
                }
            }
        }

        // 进入下一关（点击后可跳转到书架页面）
        nextBtn.addEventListener('click', () => {
            alert('成功通过！即将进入书架区');
            window.location.href = "bookshelf.html";
        });
    </script>
</body>
</html>
